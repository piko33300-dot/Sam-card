name: Build SAM CARD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Clean Android Project
        run: |
          cp android/app/google-services.json /tmp/google-services.json
          rm -rf android
          flutter create . --platforms=android --org com.samcard --project-name sam_card
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configure App Name & Firebase
        run: |
          sed -i 's/android:label="[^"]*"/android:label="SAM CARD"/' android/app/src/main/AndroidManifest.xml
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.samcard.store"/' android/app/build.gradle.kts
            sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
            sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services") version "4.4.2" apply false/' android/settings.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.samcard.store"/' android/app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle
            sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM-CARD-APK
          path: build/app/outputs/flutter-apk/app-release.apk
